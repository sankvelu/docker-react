name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.dev -t testimage .

      - name: Run tests
        run: docker run --rm -e CI=true testimage npm run test
